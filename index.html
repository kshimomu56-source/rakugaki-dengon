<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>らくがき伝言</title>
<meta name="description" content="みんなでスマホから遊べる、お絵かき伝言ゲーム。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one centered column on graph paper; chunky "sticker" buttons with offset ink shadows */
:root{
  --paper:#EEF2F8; --grid:rgba(47,91,255,.08); --card:#FFFFFF; --ink:#1C2333; --muted:#5D6780;
  --line:#CCD4E4; --accent:#2F5BFF; --accent-ink:#FFFFFF; --sun:#FFC83D; --sun-ink:#1C2333;
  --ok:#1F9D61; --warn:#D9412B; --bubble:#F3F6FC;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121725; --grid:rgba(111,140,255,.09); --card:#1C2335; --ink:#EDF1FA; --muted:#9AA5C0;
  --line:#313B57; --accent:#6F8CFF; --accent-ink:#0E1220; --sun:#FFD45C; --sun-ink:#1C2333;
  --ok:#43C98A; --warn:#FF7A63; --bubble:#252E45; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121725; --grid:rgba(111,140,255,.09); --card:#1C2335; --ink:#EDF1FA; --muted:#9AA5C0;
  --line:#313B57; --accent:#6F8CFF; --accent-ink:#0E1220; --sun:#FFD45C; --sun-ink:#1C2333;
  --ok:#43C98A; --warn:#FF7A63; --bubble:#252E45; color-scheme:dark }
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
.logo{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.logo h1{font-size:clamp(26px,6vw,38px);line-height:1.1}
.logo h1 span{display:inline-block;background:var(--sun);color:var(--sun-ink);padding:0 .25em;transform:rotate(-3deg);border-radius:4px}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
label.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
input[type=text],select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
input[type=text]:focus,select:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > input{flex:1 1 160px;min-width:0}
.btn{font:inherit;font-weight:900;font-size:15px;cursor:pointer;border:2px solid var(--ink);border-radius:12px;padding:10px 18px;
  background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.tool:focus-visible,.sw:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.small{font-size:13px;padding:6px 12px;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;cursor:pointer;flex:1 1 140px;text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px}
.seg button small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.4}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.seg button[disabled]{cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.room{display:flex;align-items:center;gap:12px;justify-content:space-between;border:2px dashed var(--line);border-radius:12px;padding:10px 12px}
.room b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.12em}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.code{font-family:var(--f-display);font-size:clamp(40px,12vw,64px);letter-spacing:.18em;line-height:1;background:var(--sun);color:var(--sun-ink);padding:10px 16px;border-radius:12px;border:2px solid var(--ink);display:inline-block}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;background:var(--paper)}
.pl .dot{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:13px}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;min-width:0}
.pl.me{border-color:var(--accent)}
.pl.done{border-color:var(--ok)}
.tag{font-size:11px;font-weight:900;padding:1px 6px;border-radius:6px;background:var(--sun);color:var(--sun-ink);white-space:nowrap}
.tag.ok{background:var(--ok);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.step{font-family:var(--f-display);font-size:14px;letter-spacing:.06em;color:var(--muted)}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:18px;border:2px solid var(--ink);border-radius:999px;padding:2px 14px;background:var(--card)}
.timer.hot{background:var(--warn);color:#fff;border-color:var(--warn)}
.prompt{background:var(--sun);color:var(--sun-ink);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;font-weight:900;font-size:clamp(18px,4.5vw,24px);text-align:center;overflow-wrap:anywhere}
.prompt small{display:block;font-size:12px;font-weight:700;opacity:.75;letter-spacing:.06em}
.board{display:block;background:#fff;border:2px solid var(--ink);border-radius:12px;touch-action:none;cursor:crosshair;box-sizing:border-box;max-width:100%}
.shot{display:block;width:100%;max-width:100%;height:auto;background:#fff;border:2px solid var(--ink);border-radius:12px;box-sizing:border-box}
/* 描く画面：ページ全体を固定し、上＝お題、中＝キャンバス、下＝道具と完成ボタン */
body.drawmode{overflow:hidden;overscroll-behavior:none}
body.drawmode .wrap{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));box-sizing:border-box;padding-block:8px;gap:8px;overflow:hidden}
body.drawmode #chatfab{display:none}
.drawtop{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;min-width:0}
.prompt.compact{padding:6px 12px;font-size:clamp(16px,4vw,20px)}
.refbox{display:flex;flex-direction:column;align-items:center;gap:4px}
.refimg{display:block;max-height:18dvh;max-width:100%;background:#fff;border:2px solid var(--ink);border-radius:10px;cursor:zoom-in}
.refimg.big{max-height:42dvh;cursor:zoom-out}
.canvasbox{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.drawbar{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 10px;min-width:0}
.drawbar .tools{gap:6px;min-width:0}
.drawbar .swatches,.drawbar .toolrow{flex-wrap:nowrap;overflow-x:auto;padding:5px}
.drawbar .sw,.drawbar .tool{flex:0 0 auto}
.drawact{display:flex;gap:8px;align-items:center;justify-content:space-between}
.drawact .btn.primary{flex:1;max-width:320px;margin-left:auto}
.tools{display:flex;flex-direction:column;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.toolrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tool{font:inherit;font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.tool .pt{display:inline-block;background:var(--ink);border-radius:50%}
.album{display:flex;flex-direction:column;gap:14px}
.item{display:flex;flex-direction:column;gap:6px;animation:pop .35s ease-out}
.who{font-size:13px;font-weight:700;color:var(--muted)}
.bubble{background:var(--bubble);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:clamp(18px,4vw,22px);font-weight:900;overflow-wrap:anywhere}
.bubble.skip{font-weight:500;font-size:15px;color:var(--muted)}
.item .shot{max-width:min(420px,100%)}
.watch{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.wcell{display:flex;flex-direction:column;gap:6px;min-width:0}
.wname{display:flex;align-items:center;gap:8px;min-width:0}
.wname .dot{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:12px}
.wname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;min-width:0;flex:1}
.ph{aspect-ratio:4/5;max-width:100%;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.chatfab{position:fixed;z-index:15;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;gap:6px}
.badge{background:var(--warn);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;line-height:20px;text-align:center}
.chatpanel{position:fixed;z-index:16;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(360px,calc(100% - 32px));height:min(520px,70vh);background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden}
.chathead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 14px;border-bottom:2px solid var(--line)}
.chathead b{font-family:var(--f-display);font-weight:400}
.chatlist{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{display:flex;flex-direction:column;gap:2px;max-width:85%;align-self:flex-start;min-width:0}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg .mn{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px}
.mdot{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:900;flex:0 0 18px}
.msg .mt{background:var(--bubble);border-radius:12px;padding:6px 10px;overflow-wrap:anywhere;font-weight:500}
.msg.mine .mt{background:var(--accent);color:var(--accent-ink)}
.quick{display:flex;gap:6px;padding:6px 10px 0;overflow-x:auto}
.quick button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.chatform{display:flex;gap:6px;padding:8px 10px 10px}
.chatform input{flex:1;min-width:0;padding:8px 10px}
.wrap{padding-bottom:96px}
.refbox{display:flex;flex-direction:column;gap:6px}
.refbox .shot{max-width:420px}
.chatlock{font-size:12px;color:var(--muted);padding:0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.howto div{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.howto b{font-family:var(--f-display);font-weight:400;display:block;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.big{font-size:clamp(20px,5vw,26px)}
.center{text-align:center;align-items:center}
@keyframes pop{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.item{animation:none}.btn{transition:none}}
</style>

<div class="wrap" id="app"><div class="card center"><p class="muted">読み込み中…</p></div></div>
<div class="toast" id="toast" hidden></div>
<div id="chat" hidden>
  <div class="chatpanel" id="chatpanel" hidden>
    <div class="chathead"><b>チャット</b><button class="btn small ghost" id="chatclose" type="button">閉じる</button></div>
    <div class="chatlist" id="chatlist"></div>
    <div class="quick" id="chatquick"></div>
    <p class="chatlock" id="chatlock" hidden>ゲーム中はチャットお休み（相談・ヒントなし）。結果発表で話そう！</p>
    <form class="chatform" id="chatform"><input type="text" id="chatinput" maxlength="100" placeholder="メッセージ" autocomplete="off"><button class="btn small primary" type="submit">送信</button></form>
  </div>
  <button class="btn chatfab" id="chatfab" type="button">チャット<span class="badge" id="chatbadge" hidden></span></button>
</div>

<script>
(() => {
'use strict';
const PROMPTS = ["宇宙で迷子のペンギン","寝坊したサンタクロース","カレーを作る恐竜","温泉に入るロボット","空を飛ぶ食パン","雪だるまの結婚式","魚屋さんのタコ","雨の日のカエルの通勤","忍者のおばあちゃん","巨大なプリン","ピアノを弾くゴリラ","月でお餅つき","電車で寝ているネコ","焼き芋の屋台","サッカーをするキノコ","おにぎりの家","風邪をひいた太陽","ダンスするブロッコリー","海賊のハムスター","迷子のエレベーター","スキーをするパンダ","しゃべる冷蔵庫","花火を見るクラゲ","魔法使いの犬","落ち込んだ火山","ラーメンの滝","タイムマシンで来た侍","筋トレするウサギ","傘をさすキリン","歯医者さんのワニ","アイドルのカブトムシ","お化け屋敷のおばけが怖がる","メロンパンの顔","UFOに連れていかれる牛","満員電車のペンギン","ツリーに登るコアラ","ドーナツの惑星","掃除機に吸われる猫","雲の上の喫茶店","歌うサボテン"];
const COLORS = ["#1C1C1C","#8A8A8A","#FFFFFF","#E5383B","#FF8C1A","#FFD43B","#2FBF71","#17A2B8","#2F5BFF","#8E44EC","#FF6FB5","#8B5A2B","#F6C9A7"];
const AVATAR = ["#2F5BFF","#E5383B","#2FBF71","#FF8C1A","#8E44EC","#17A2B8","#FF6FB5","#8B5A2B","#C9A400","#5D6780"];
const CODE_CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const MAXP = 15;

const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==='class') el.className=v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k==='style') el.style.cssText=v;
    else el.setAttribute(k, v===true?'':v);
  }
  for (const k of kids.flat()){ if (k==null||k===false) continue; el.append(k instanceof Node?k:document.createTextNode(String(k))); }
  return el;
}
const lsGet = k => { try { return localStorage.getItem('rkg:'+k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem('rkg:'+k, v); } catch(e){} };
const rand = n => Math.floor(Math.random()*n);
const randPrompt = () => PROMPTS[rand(PROMPTS.length)];
const genCode = () => Array.from({length:4},()=>CODE_CH[rand(CODE_CH.length)]).join('');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800); }

const S = { db:null, uid:null, canWrite:true, ready:false, code:null, game:null, gameLoaded:false,
  players:{}, entries:{}, subs:[], homeUnsub:null, openGames:[], timers:[], jumped:false, autoJoin:null, doneTab:0, submitting:false };

function gref(){ return S.db.doc('games/'+S.code); }
function nickOf(id){ return (S.game && S.game.nicks && S.game.nicks[id]) || (S.players[id] && S.players[id].nick) || '？'; }
function colorOf(id){ const i = S.game && S.game.order ? S.game.order.indexOf(id) : -1; let n=i; if(n<0){ n=0; for(const c of id) n=(n*31+c.charCodeAt(0))>>>0; } return AVATAR[n%AVATAR.length]; }
function avatar(id){ return h('span',{class:'dot',style:'background:'+colorOf(id)}, [...nickOf(id)][0]||'?'); }
function sortedPlayers(){ return Object.entries(S.players).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)).map(e=>e[0]); }
function hostId(){
  const g=S.game; if(!g) return null;
  if (g.phase==='lobby' && !S.players[g.hostId]) return sortedPlayers()[0] || g.hostId;
  return g.hostId;
}
const isHost = () => hostId()===S.uid;
function kindOf(mode,R){ if(R===0) return 'prompt'; if(mode==='draw') return R===1?'draw':'copy'; return R%2?'draw':'guess'; }
const isPic = k => k==='draw'||k==='copy';
function currentRound(){
  const n=(S.game.order||[]).length; const cnt=new Array(n).fill(0);
  for (const e of Object.values(S.entries)) if (e.round>=0 && e.round<n) cnt[e.round]++;
  for (let r=0;r<n;r++) if (cnt[r]<n) return r;
  return n;
}
async function safe(p, msg){ try { return await p; } catch(e){ console.warn(e); toast(e && e.code==='invalid_argument' ? 'この部屋に書き込む権限がありません' : (msg||'うまく保存できませんでした。もう一度試してね')); throw e; } }

/* ---------- routing / subscriptions ---------- */
function route(){
  const m = (location.hash||'').slice(1).toUpperCase();
  const code = /^[A-Z0-9]{4}$/.test(m) ? m : null;
  if (code !== S.code){
    S.subs.forEach(u=>{try{u()}catch(e){}}); S.subs=[];
    Object.assign(S,{code, game:null, gameLoaded:false, players:{}, entries:{}, live:{}, jumped:false, doneTab:0});
    chat.setCode(code);
    if (code){
      if (S.homeUnsub){ S.homeUnsub(); S.homeUnsub=null; }
      const onErr = e => { console.warn(e); toast('接続が切れました。ページを開き直してね'); };
      S.subs.push(S.db.doc('games/'+code).onSnapshot(s=>{ S.game = s.exists ? s.data() : null; S.gameLoaded=true; render(); }, onErr));
      S.subs.push(S.db.collection(`games/${code}/players`).onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.players=o; render(); }, onErr));
      S.subs.push(S.db.collection(`games/${code}/entries`).onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.entries=o; render(); }, onErr));
      S.subs.push(S.db.collection(`games/${code}/live`).onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.live=o; if(cur.api && cur.api.live) cur.api.live(); }, e=>console.warn(e)));
    }
  }
  if (!code && !S.homeUnsub){
    {
      S.homeUnsub = S.db.collection('games').orderBy('createdAt','desc').limit(20).onSnapshot(q=>{
        const now=Date.now();
        S.openGames = q.docs.map(d=>d.data()).filter(g=>g.phase==='lobby' && !g.next && now-(g.createdAt||0) < 3*3600e3);
        render();
      }, e=>console.warn(e));
    }
  }
  render();
}

let cur = { key:null, api:null };
function clearTimers(){ S.timers.forEach(t=>{ if(t && t.ro){ t.ro.disconnect(); return; } clearInterval(t); clearTimeout(t); }); S.timers=[]; }
function view(){
  if (!S.ready) return {name:'msg', key:'loading', text:'読み込み中…'};
  if (!S.code) return {name:'home', key:'home'};
  if (!S.gameLoaded) return {name:'msg', key:'gl', text:'部屋に接続中…'};
  const g=S.game;
  if (!g) return {name:'missing', key:'missing:'+S.code};
  const order=g.order||[], n=order.length, me=order.indexOf(S.uid);
  if (g.next && (me>=0 || S.players[S.uid])){
    if (!S.jumped){ S.jumped=true; S.timers.push(setTimeout(()=>{ location.hash=g.next; },600)); }
    return {name:'msg', key:'next', text:'次のゲームへ移動中…'};
  }
  if (g.phase==='lobby') return {name:'lobby', key:'lobby:'+S.code};
  if (g.phase==='done') return {name:'done', key:'done:'+S.code};
  const R=currentRound();
  if (g.phase==='reveal' || R>=n) return {name:'reveal', key:'reveal:'+S.code};
  if (me<0) return {name:'spectate', key:'spec:'+S.code};
  const chain=(me-R+n)%n;
  if (S.entries[`r${R}_c${chain}`]) return {name:'wait', key:`wait:${S.code}:${R}`, R};
  return {name:'task', key:`task:${S.code}:${R}:${chain}`, R, chain};
}
function render(){
  const v=view();
  if (v.key!==cur.key){
    clearTimers(); S.submitting=false; document.body.classList.remove('drawmode');
    const root=$('#app'); root.replaceChildren();
    cur={ key:v.key, api: SCREENS[v.name](root, v) || {} };
  }
  if (cur.api.patch) cur.api.patch(v);
  chat.sync();
}

  return h('div',{class:'logo'}, h('h1',{}, 'らくがき', h('span',{},'伝言')), right||null);

    await safe(S.db.doc('games/'+code).set({code, mode, drawSec, textSec: drawSec?45:0, hostId:S.uid, hostNick:nk, phase:'lobby', createdAt:Date.now(), order:[], revealChain:0, revealStep:0}));

        h('h2',{style:'margin-top:6px'},'募集中の部屋'), list)),

      h('div',{}, h('b',{},'1. 集まる'),'部屋をつくってコードを伝える。2〜15人（4人以上がおすすめ）。'),
      h('div',{}, h('b',{},'2. 伝言する'),'最初にお題を書き、あとは前の人の絵だけを見て描きつなぐ。答えになるヒントはチャットに書かないでね。'),

lobby(root){

      h('div',{class:'row',style:'justify-content:center'},
        h('button',{class:'btn small sun',onclick:()=>{ const u=location.origin+location.pathname+'#'+S.code; navigator.clipboard.writeText(u).then(()=>toast('招待リンクをコピーしました'),()=>toast(u)); }},'招待リンクをコピー'),
        h('button',{class:'btn small',onclick:()=>{ navigator.clipboard.writeText(S.code).then(()=>toast('コードをコピーしました'),()=>toast('コード：'+S.code)); }},'コードをコピー'))),
    joinEl,

  async function leave(){

  let joinBuilt=false, fixingHost=false;
  return { patch(){

    if (S.autoJoin===S.code && !joined && lsGet('nick')){ S.autoJoin=null; join(lsGet('nick')); }
    if (host && g.hostId!==S.uid && !fixingHost){ fixingHost=true; gref().update({hostId:S.uid, hostNick:nickOf(S.uid)}).catch(()=>{}); }
    if (!joined && !joinBuilt){

    } else if (joined && joinBuilt){ joinBuilt=false; joinEl.replaceChildren(); }
    const ids=sortedPlayers(), hid=hostId();
    countEl.textContent = ids.length+' / '+MAXP+' 人';
    playersEl.replaceChildren(...(ids.length?ids:[]).map(id=>h('div',{class:'pl'+(id===S.uid?' me':'')}, avatar(id), h('span',{class:'nm'},nickOf(id)), id===hid?h('span',{class:'tag'},'ホスト'):null)));

    // settings

    const sel=h('select',{id:'lobbysec',disabled:!host}, ...[[60,'60秒'],[90,'90秒'],[120,'120秒'],[180,'180秒'],[0,'なし']].map(([v,t])=>h('option',{value:v,selected:v===g.drawSec},t)));
    sel.addEventListener('change',()=>safe(gref().update({drawSec:+sel.value, textSec:+sel.value?45:0})));
    const liveOn = g.live===true;
    const liveCb=h('input',{type:'checkbox',id:'livecb',checked:liveOn,disabled:!host,style:'width:20px;height:20px;accent-color:var(--accent)'});
    liveCb.addEventListener('change',()=>safe(gref().update({live:liveCb.checked})));
    settingsEl.replaceChildren(h('h2',{},'ルール'), seg, h('label',{class:'lbl',for:'lobbysec'},'描く時間'), sel,
      h('label',{class:'row',for:'livecb',style:'gap:8px;font-weight:700;cursor:pointer'}, liveCb, '描いている途中の絵を、待っている人に見せる（オフ推奨：ルールでは途中は共有しません）'),
      host?null:h('p',{class:'muted',style:'margin:0;font-size:13px'},'ルールはホストが決めます'));
    if (host){
      const ok=ids.length>=2;
      actionEl.replaceChildren(h('button',{class:'btn primary big',disabled:!ok,onclick:start}, 'ゲームをはじめる'),

task(root,v){
  const g=S.game, n=g.order.length, R=v.R, chain=v.chain, kind=kindOf(g.mode,R);
  const prev=S.entries[`r${R-1}_c${chain}`];
  const sec = isPic(kind) ? (g.drawSec||0) : (g.textSec||0);
  const timerEl=h('span',{class:'timer'},'');
  const labels={prompt:'お題を書こう',draw:'絵を描こう',guess:'何の絵か当てよう',copy:'前の人の絵を描きつなごう'};
  root.append(header(), h('div',{class:'bar'}, h('span',{class:'step'},`ラウンド ${R+1} / ${n}・${labels[kind]}`), sec?timerEl:null));
  const body=h('div',{class:'card'}); root.append(body);
  let autoSubmit=()=>{};
  const doSubmit = async (data) => {
    if (S.submitting) return; S.submitting=true;
    try { await safe(S.db.doc(`games/${S.code}/entries/r${R}_c${chain}`).set({round:R, chain, author:S.uid, kind, text:'', img:null, at:Date.now(), ...data})); }
    catch(e){ S.submitting=false; }
  };
  function startTimer(total){
    if (!total) return;
    const end=Date.now()+total*1000;
    const tick=()=>{ const left=Math.max(0,Math.ceil((end-Date.now())/1000)); timerEl.textContent=left+'秒'; timerEl.classList.toggle('hot',left<=10);
      if(left<=0){ clearInterval(t); autoSubmit(); } };
    const t=setInterval(tick,250); S.timers.push(t); tick();
  }
  if (kind==='prompt' || kind==='guess'){
    const inp=h('input',{type:'text',id:'answer',maxlength:'40',placeholder: kind==='prompt'?'例：宇宙で迷子のペンギン':'これは何？',autocomplete:'off'});
    const send=()=>{ const t=inp.value.trim(); if(!t){ toast('ひとこと書いてね'); return; } doSubmit({text:t}); };
    autoSubmit=()=>doSubmit({text: inp.value.trim()||'？？？'});
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.isComposing) send(); });
    if (kind==='prompt'){
      body.append(h('h2',{},'みんなに描いてほしいお題は？'), h('p',{class:'muted',style:'margin:0'},'次の人がこれを絵にします。おもしろくて、ちょっと難しいくらいがちょうどいい。'),
        h('div',{class:'row'}, inp, h('button',{class:'btn small',onclick:()=>{inp.value=randPrompt();inp.focus();}},'おまかせ')),
        h('button',{class:'btn primary',onclick:send},'これにする'));
    } else {
      body.append(h('h2',{},'この絵は何？'),
        prev && prev.img ? h('img',{class:'shot',src:safeImg(prev.img),alt:'前の人の絵'}) : h('div',{class:'empty'},'前の人の絵がありません。好きな言葉を書いてね'),
        h('div',{class:'row'}, inp, h('button',{class:'btn primary',onclick:send},'決定')));
    }
    setTimeout(()=>inp.focus(),50);
    startTimer(sec);
  } else {
    const pad=makePad();
    if (g.live===true){
      let sentVer=-1, busy=false;
      const liveRef=S.db.doc(`games/${S.code}/live/${S.uid}`);
      S.timers.push(setInterval(async()=>{
        if (busy || S.submitting || pad.ver()===sentVer || !document.body.contains(pad.canvas)) return;
        busy=true; const v=pad.ver();
        try { await liveRef.set({round:R, chain, img:pad.thumb(), at:Date.now()}); sentVer=v; } catch(e){ console.warn(e); }
        busy=false;
      },1000));
    }
    const finish=()=>{ if(!pad.dirty()){ toast('何か描いてから完成してね'); return; } doSubmit({img:pad.export()}); };
    autoSubmit=()=>doSubmit({img:pad.export()});
    let topContent;
    if (kind==='draw'){
      const text = prev && !prev.skipped ? prev.text : '';
      topContent = h('div',{class:'prompt compact'}, h('small',{}, R===1?'お題':'前の人の言葉'), text || '（自由に描いてね）');
    } else { // copy: 前の人の絵だけを見て描く
      if (prev && prev.img){
        const img=h('img',{class:'refimg',src:safeImg(prev.img),alt:'前の人の絵（タップで拡大）'});
        img.addEventListener('click',()=>img.classList.toggle('big'));
        topContent = h('div',{class:'refbox'}, h('span',{class:'lbl'},'前の人の絵（タップで拡大）'), img);
      } else topContent = h('div',{class:'prompt compact'}, h('small',{},'前の絵がありません'),'自由に描いてね');
    }
    // 描く画面は画面全体に固定（ページがスクロールしないので、うっかり線を引かない）
    document.body.classList.add('drawmode');
    root.replaceChildren();
    const box=h('div',{class:'canvasbox'}, pad.canvas);
    root.append(
      h('div',{class:'drawtop'}, h('div',{class:'bar'}, h('span',{class:'step'},`${R+1} / ${n}ターン・${labels[kind]}`), sec?timerEl:null), topContent),
      box,
      h('div',{class:'drawbar'}, pad.tools,
        h('div',{class:'drawact'}, h('button',{class:'btn small ghost',type:'button',onclick:()=>chat.open()},'チャット'),
          h('button',{class:'btn primary big',type:'button',onclick:finish},'完成！'))));
    const fit=()=>{ const r=box.getBoundingClientRect(); if(!r.width||!r.height) return;
      const w=Math.floor(Math.min(r.width, r.height*pad.W/pad.H)); pad.canvas.style.width=w+'px'; pad.canvas.style.height=Math.floor(w*pad.H/pad.W)+'px'; };
    if (window.ResizeObserver){ const ro=new ResizeObserver(fit); ro.observe(box); S.timers.push({ro}); }
    window.addEventListener('resize',fit); setTimeout(fit,0);
    startTimer(sec);
  }
},

reveal(root){

        h('button',{class:'btn primary big',onclick:()=>{ if(last){ safe(gref().update({phase:'done'})); return; } let C=c,St=s; if(St<n-1) St++; else {C++;St=0;} safe(gref().update({phase:'reveal',revealChain:C,revealStep:St})); }},
          last?'おしまい！':(s===n-1?'次のアルバムへ':'次をめくる')),

  root.append(header(homeBtn()), h('h2',{},'みんなのアルバム'), tabs, h('div',{class:'card'}, albumEl), ctrl);
  return { patch(){
    const g=S.game, n=g.order.length; if(S.doneTab>=n) S.doneTab=0;
    tabs.replaceChildren(...g.order.map((id,i)=>h('button',{class:'btn small'+(i===S.doneTab?' sun':''),onclick:()=>{S.doneTab=i;cur.api.patch();}}, nickOf(id))));

    ctrl.replaceChildren(isHost()? h('button',{class:'btn primary big',onclick:again},'同じメンバーでもう一回') : h('p',{class:'muted',style:'margin:0'},'ホストが「もう一回」を押すと、自動で次の部屋に移動します'));
  }};

};

function makeWatch(){
  const grid=h('div',{class:'watch'}), el=h('div',{class:'card'}, h('div',{class:'bar'}, h('h2',{},'みんなの様子'), h('span',{class:'muted',style:'font-size:13px'},'1秒ごとに更新')), grid);
  const cells={};
  function update(R){
    const g=S.game; if(!g || !g.order) return;
    const n=g.order.length;
    if (g.live!==true || R>=n){ el.hidden=true; return; }
    el.hidden=false;
    const kind=kindOf(g.mode,R), ids=g.order.filter(id=>id!==S.uid);
    for (const id of Object.keys(cells)) if(!ids.includes(id)){ cells[id].root.remove(); delete cells[id]; }
    ids.forEach(id=>{
      let c=cells[id];
      if (!c){ const img=h('img',{class:'shot',alt:nickOf(id)+'のキャンバス'}), ph=h('div',{class:'ph'}), st=h('span',{class:'tag'});
        c=cells[id]={img,ph,st,src:'',root:h('div',{class:'wcell'}, h('div',{class:'wname'}, avatar(id), h('span',{class:'nm'},nickOf(id)), st), img, ph)}; grid.append(c.root); }
      const p=g.order.indexOf(id), ch=(p-R+n)%n, e=S.entries[`r${R}_c${ch}`], lv=S.live[id];
      let src='', text='';
      if (e){ c.st.textContent='完成'; c.st.className='tag ok'; if(isPic(e.kind) && e.img) src=e.img; else text= e.skipped?'スキップ':'提出しました'; }
      else { c.st.textContent='作業中'; c.st.className='tag';
        if (isPic(kind)){ if (lv && lv.round===R && lv.chain===ch && lv.img) src=lv.img; else text='描きはじめ…'; }
        else text='考え中…'; }
      src=safeImg(src);
      if (src){ if(c.src!==src){ c.img.src=src; c.src=src; } c.img.hidden=false; c.ph.hidden=true; }
      else { c.img.hidden=true; c.ph.hidden=false; c.ph.textContent=text; }
    });
  }
  return { el, update };
}
function safeImg(u){ return (typeof u==='string' && u.startsWith('data:image/')) ? u : ''; }
function chainItems(c, upTo){
  const g=S.game, n=g.order.length, out=[];
  for (let r=0;r<=upTo && r<n;r++){
    const e=S.entries[`r${r}_c${c}`]; const author=g.order[(c+r)%n];
    let body;
    if (!e) body=h('div',{class:'bubble skip'},'（読み込み中…）');
    else if (e.skipped) body=h('div',{class:'bubble skip'},'（スキップされました）');
    else if (isPic(e.kind)) body = e.img ? h('img',{class:'shot',src:safeImg(e.img),alt:nickOf(author)+'の絵'}) : h('div',{class:'bubble skip'},'（白紙）');
    else body=h('div',{class:'bubble'}, e.text||'？？？');
    const verb = e ? (isPic(e.kind)?'が描いた':(r===0?'のお題':'の答え')) : '';
    out.push(h('div',{class:'item'}, h('span',{class:'who'}, nickOf(author)+verb), body));
  }
  return out;
}
function renderProgress(listEl, hostEl, R){
  const g=S.game, n=g.order.length; if (R>=n) return;
  const pending=[];
  listEl.replaceChildren(...g.order.map((id,p)=>{
    const ch=(p-R+n)%n, done=!!S.entries[`r${R}_c${ch}`]; if(!done) pending.push([id,ch]);
    return h('div',{class:'pl'+(done?' done':'')+(id===S.uid?' me':'')}, avatar(id), h('span',{class:'nm'},nickOf(id)), h('span',{class:'tag'+(done?' ok':'')}, done?'済':'作業中'));
  }));
  if (!hostEl) return;
  if (isHost() && pending.length){
    hostEl.replaceChildren(h('p',{class:'muted',style:'margin:0;font-size:13px'},'抜けてしまった人がいたら、ホストがスキップできます'),
      h('div',{class:'row'}, ...pending.map(([id,ch])=>h('button',{class:'btn small ghost',onclick:()=>{
        const kind=kindOf(g.mode,R);
        safe(S.db.doc(`games/${S.code}/entries/r${R}_c${ch}`).set({round:R, chain:ch, author:id, kind, text:'', img:null, skipped:true, at:Date.now()}));
      }}, nickOf(id)+' をスキップ'))));

}
async function again(){
  const g=S.game; let code;
  for (let i=0;i<5;i++){ code=genCode(); const s=await S.db.doc('games/'+code).get(); if(!s.exists) break; }

/* ---------- drawing pad ---------- */
function makePad(){
  const W=720, H=900;
  const canvas=h('canvas',{class:'board',width:W,height:H,'aria-label':'お絵かきキャンバス'});
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
  let color=COLORS[0], size=8, tool='pen', drawing=false, last=null, dirty=false, ver=0; const undo=[];
  const snap=()=>{ undo.push(ctx.getImageData(0,0,W,H)); if(undo.length>25) undo.shift(); ver++; };
  const small=document.createElement('canvas'); small.width=320; small.height=400;
  const pos=e=>{ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; };
  function stroke(a,b){ ctx.strokeStyle= tool==='eraser'?'#FFFFFF':color; ctx.lineWidth= tool==='eraser'?size*2.5:size; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault(); const p=pos(e); snap(); dirty=true;
    if (tool==='fill'){ flood(Math.floor(p.x),Math.floor(p.y)); return; }
    drawing=true; last=p; try{canvas.setPointerCapture(e.pointerId);}catch(_){} stroke(p,{x:p.x+.01,y:p.y});
  });
  canvas.addEventListener('pointermove',e=>{
    if(!drawing) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){ const p=pos(ev); stroke(last,p); last=p; }
    ver++;
  });
  const up=()=>{ drawing=false; }; canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up); canvas.addEventListener('pointerleave',up);
  function hex(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
  function flood(x,y){
    if(x<0||y<0||x>=W||y>=H) return;
    const img=ctx.getImageData(0,0,W,H), d=img.data, i0=(y*W+x)*4, t=[d[i0],d[i0+1],d[i0+2]], f=hex(color), tol=48;
    if (Math.abs(t[0]-f[0])+Math.abs(t[1]-f[1])+Math.abs(t[2]-f[2])<6) return;
    const seen=new Uint8Array(W*H), st=[x+y*W];
    const match=k=>{ const j=k*4; return Math.abs(d[j]-t[0])+Math.abs(d[j+1]-t[1])+Math.abs(d[j+2]-t[2])<=tol; };
    while(st.length){ const k=st.pop(); if(seen[k]) continue; seen[k]=1; if(!match(k)) continue;
      const j=k*4; d[j]=f[0]; d[j+1]=f[1]; d[j+2]=f[2]; d[j+3]=255;
      const px=k%W; if(px>0) st.push(k-1); if(px<W-1) st.push(k+1); if(k>=W) st.push(k-W); if(k<W*(H-1)) st.push(k+W); }
    // grow fill by 1px to cover anti-aliased edges
    ctx.putImageData(img,0,0);
  }
  const sw=h('div',{class:'swatches'}), toolRow=h('div',{class:'toolrow'});
  function paint(){
    sw.replaceChildren(...COLORS.map(c=>h('button',{class:'sw',type:'button',style:'background:'+c,'aria-label':'色 '+c,'aria-pressed':String(c===color&&tool!=='eraser'),
      onclick:()=>{ color=c; if(tool==='eraser') tool='pen'; paint(); }})));
    const tb=(k,label)=>h('button',{class:'tool',type:'button','aria-pressed':String(tool===k),onclick:()=>{tool=k;paint();}},label);
    const sb=(v,px)=>h('button',{class:'tool',type:'button','aria-pressed':String(size===v),'aria-label':'太さ '+v,onclick:()=>{size=v;paint();}}, h('span',{class:'pt',style:`width:${px}px;height:${px}px`}));
    toolRow.replaceChildren(tb('pen','ペン'), tb('eraser','消しゴム'),
      h('button',{class:'tool',type:'button',onclick:()=>{ const s=undo.pop(); if(s){ ctx.putImageData(s,0,0); ver++; } }},'1つ戻す'),
      sb(4,5), sb(10,10), sb(22,17), tb('fill','塗りつぶし'),
      h('button',{class:'tool',type:'button',onclick:()=>{ snap(); ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H); }},'全部消す'));
  }
  paint();
  return { canvas, W, H, tools:h('div',{class:'tools'}, sw, toolRow), dirty:()=>dirty, ver:()=>ver,
    thumb(){ const c=small.getContext('2d'); c.drawImage(canvas,0,0,320,400); return small.toDataURL('image/jpeg',.6); },
    export(){ let q=.8, u=canvas.toDataURL('image/jpeg',q); while(u.length>220000 && q>.3){ q-=.15; u=canvas.toDataURL('image/jpeg',q); } return u; } };
}

/* ---------- chat ---------- */
const chat = (() => {
  const root=$('#chat'), panel=$('#chatpanel'), list=$('#chatlist'), input=$('#chatinput'), badge=$('#chatbadge');
  let unsub=null, msgs=[], open=false, seen=0, lastSend=0;
  const QUICK=['www','うまい！','なにこれ','天才','待って','おつかれ！'];
  $('#chatquick').replaceChildren(...QUICK.map(q=>h('button',{type:'button',onclick:()=>send(q)},q)));
  function setOpen(v){ open=v; panel.hidden=!v; $('#chatfab').hidden=v; if(v){ seen=Date.now(); paint(); setTimeout(()=>input.focus(),30); } }
  $('#chatfab').addEventListener('click',()=>setOpen(true));
  $('#chatclose').addEventListener('click',()=>setOpen(false));
  $('#chatform').addEventListener('submit',e=>{ e.preventDefault(); send(input.value); });
  function locked(){ return false; }
  function sync(){ const l=locked(); $('#chatlock').hidden=!l; $('#chatquick').hidden=l; input.disabled=l; $('#chatform').querySelector('button').disabled=l; }
  async function send(t){
    t=(t||'').trim().slice(0,100); if(!t || !S.code || locked()) return;
    if (Date.now()-lastSend<800) return; lastSend=Date.now();
    const nick = nickOf(S.uid)!=='？' ? nickOf(S.uid) : (lsGet('nick')||'ゲスト');
    if (t===input.value.trim()) input.value='';
    try { await S.db.collection(`games/${S.code}/chat`).add({by:S.uid, nick, text:t, at:Date.now()}); }
    catch(e){ toast(e && e.code==='invalid_argument'?'この部屋に書き込む権限がありません':'送信できませんでした'); }
  }
  function paint(){
    const atBottom = list.scrollHeight-list.scrollTop-list.clientHeight < 40;
    list.replaceChildren(...(msgs.length?msgs.map(m=>{
      const mine=m.by===S.uid, nm=String(m.nick||'？').slice(0,12);
      return h('div',{class:'msg'+(mine?' mine':'')},
        h('span',{class:'mn'}, h('span',{class:'mdot',style:'background:'+colorOf(String(m.by||'x'))}, [...nm][0]||'?'), mine?nm+'（あなた）':nm),
        h('span',{class:'mt'}, String(m.text||'').slice(0,100)));
    }) :
      [h('p',{class:'muted',style:'margin:auto;font-size:13px'},'まだメッセージはありません')]));
    if (atBottom || open) list.scrollTop=list.scrollHeight;
    if (open) seen=Date.now();
    const un = open?0:msgs.filter(m=>m.at>seen && m.by!==S.uid).length;
    badge.hidden=!un; badge.textContent=un>9?'9+':String(un);
  }
  function setCode(code){
    if (unsub){ unsub(); unsub=null; } msgs=[]; seen=Date.now();
    root.hidden=!code; if(!code){ setOpen(false); return; }
    unsub=S.db.collection(`games/${code}/chat`).orderBy('at','desc').limit(60).onSnapshot(q=>{ msgs=q.docs.map(d=>d.data()).reverse(); paint(); }, e=>console.warn(e));
    paint();
  }
  return { setCode, sync, open:()=>setOpen(true) };
})();

/* ---------- boot ---------- */
async function boot(){
  const C = window.claude;
  const [db,user] = C && C.use ? await Promise.all([C.use('db'), C.use('user')]) : [null,null];
  if (!db){ $('#app').replaceChildren(); SCREENS.nodb($('#app')); return; }
  S.db=db;
  let id = user ? await user.id() : null;
  if (!id){ id = lsGet('pid'); if(!id){ id='p'+Math.random().toString(36).slice(2,12); lsSet('pid',id); } }
  S.uid=id;
  if (user){ try { if ((await user.can('data.write'))===false) S.canWrite=false; } catch(e){} }
  S.ready=true;
  window.addEventListener('hashchange', route);
  route();
}
if (window.claude) boot(); else window.addEventListener('claude-ready', boot, {once:true});
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc as fdoc, collection as fcol, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot as fsnap, query, orderBy as fOrder, limit as fLimit, where as fWhere } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyArr63Zg__ygqloEjYWJGkb2U6K3iOCBa4",
  authDomain: "yoruno-app.firebaseapp.com",
  projectId: "yoruno-app",
  storageBucket: "yoruno-app.firebasestorage.app",
  messagingSenderId: "1097484345226",
  appId: "1:1097484345226:web:47ec1c5d670dd8f63fb273"
};
const app = initializeApp(firebaseConfig);
const fs = getFirestore(app);
const auth = getAuth(app);

// Firestore を、ゲーム本体が使う小さなAPIの形に包む
const wrapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });
const wrapQ = q => ({ docs: q.docs.map(wrapDoc), size: q.size, empty: q.empty });
const errOf = e => ({ code: e && e.code === 'permission-denied' ? 'invalid_argument' : 'unavailable', message: String(e && e.message) });
function docRef(path){
  const r = fdoc(fs, path);
  return {
    id: r.id, path,
    get: () => getDoc(r).then(wrapDoc),
    set: d => setDoc(r, d).catch(e => { throw errOf(e); }),
    update: d => updateDoc(r, d).catch(e => { throw errOf(e); }),
    delete: () => deleteDoc(r).catch(e => { throw errOf(e); }),
    onSnapshot: (next, err) => fsnap(r, s => next(wrapDoc(s)), e => err && err(errOf(e))),
    collection: sub => colRef(path + '/' + sub)
  };
}
function colRef(path, cons = []){
  const base = () => cons.length ? query(fcol(fs, path), ...cons) : fcol(fs, path);
  return {
    path,
    where: (f, op, v) => colRef(path, [...cons, fWhere(f, op, v)]),
    orderBy: (f, d) => colRef(path, [...cons, fOrder(f, d || 'asc')]),
    limit: n => colRef(path, [...cons, fLimit(n)]),
    doc: id => id ? docRef(path + '/' + id) : docRef(fdoc(fcol(fs, path)).path),
    add: d => addDoc(fcol(fs, path), d).then(r => docRef(r.path)).catch(e => { throw errOf(e); }),
    get: () => getDocs(base()).then(wrapQ),
    onSnapshot: (next, err) => fsnap(base(), q => next(wrapQ(q)), e => err && err(errOf(e)))
  };
}
const dbApi = { doc: docRef, collection: colRef };

let uid = null;
const ready = new Promise(res => {
  onAuthStateChanged(auth, u => { if (u) { uid = u.uid; res(true); } });
  signInAnonymously(auth).catch(e => { console.error(e); res(false); });
  setTimeout(() => res(!!uid), 10000);
});
const userApi = { id: async () => uid, can: async () => true, isOwner: async () => false, canEdit: async () => false };

window.claude = { use: async name => {
  const ok = await ready;
  if (!ok) return null;
  if (name === 'db') return dbApi;
  if (name === 'user') return userApi;
  return null;
}};
window.dispatchEvent(new Event('claude-ready'));
</script>
